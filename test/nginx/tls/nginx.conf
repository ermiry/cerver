worker_processes 1;

events {
	worker_connections 1024;
}

http {
	access_log off;
	error_log /dev/stderr warn;

	gzip off;

	upstream cerver_tls {
		server cerver-tls:8443;

		keepalive 32;
		keepalive_timeout 8s;
		keepalive_requests 512;
	}

	server {
		listen 80;
		listen [::]:80;

		keepalive_timeout 0;

		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Request-Id $request_id;

		proxy_connect_timeout 4s;
		proxy_send_timeout 16s;
		proxy_read_timeout 16s;

		proxy_next_upstream off;

		proxy_ssl_verify on;
		proxy_ssl_verify_depth 2;
		proxy_ssl_trusted_certificate /certificates/authority.pem;
		proxy_ssl_name cerver-tls;
		proxy_ssl_server_name on;
		proxy_ssl_certificate /certificates/client.pem;
		proxy_ssl_certificate_key /certificates/client.key;
		proxy_ssl_session_reuse on;

		location / {
			proxy_pass https://cerver_tls;
			proxy_ssl_protocols TLSv1.2 TLSv1.3;
		}

		location /tls12/ {
			proxy_pass https://cerver_tls/;
			proxy_ssl_protocols TLSv1.2;
		}

		location /unbuffered/ {
			proxy_pass https://cerver_tls/;
			proxy_ssl_protocols TLSv1.3;

			proxy_request_buffering off;
			proxy_buffering off;
		}
	}
}
