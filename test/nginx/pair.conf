worker_processes 1;

events {
	worker_connections 1024;
}

http {
	access_log off;
	error_log /dev/stderr warn;

	client_max_body_size 16m;

	upstream disconnect {
		server cerver-disconnect:8080 max_fails=3 fail_timeout=10s;
		server cerver-disconnect-2:8080 max_fails=3 fail_timeout=10s;

		keepalive 4;
	}

	server {
		listen 80;
		listen [::]:80;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		proxy_read_timeout 16s;

		location /disconnect/ {
			proxy_pass http://disconnect/;
		}
	}
}
