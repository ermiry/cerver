worker_processes 1;

events {
	worker_connections 1024;
}

http {
	access_log off;
	error_log /dev/stderr warn;

	gzip off;

	upstream cerver {
		server cerver:8080 max_fails=0;
		server cerver-2:8080 max_fails=0;

		keepalive 16;
		keepalive_timeout 8s;
		keepalive_requests 512;
	}

	server {
		listen 80;
		listen [::]:80;

		keepalive_timeout 0;

		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;

		proxy_connect_timeout 4s;
		proxy_send_timeout 16s;
		proxy_read_timeout 16s;

		proxy_next_upstream error timeout;

		location / {
			proxy_pass http://cerver;
		}
	}
}
