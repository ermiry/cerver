services:
  cerver:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    command: ["../bin/web/features"]
    environment:
      CERVER_TEST_ADDRESS: "::"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.31.6-alpine}
    depends_on:
      - cerver
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
