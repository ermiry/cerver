services:
  cerver:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    command: ["../bin/web/features"]
    environment:
      CERVER_TEST_ADDRESS: "::"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  cerver-disconnect:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    command: ["../bin/web/disconnect"]
    restart: always
    environment:
      CERVER_TEST_ADDRESS: "::"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  cerver-disconnect-2:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    command: ["../bin/web/disconnect"]
    restart: always
    profiles: ["pair"]
    environment:
      CERVER_TEST_ADDRESS: "::"
      DISCONNECT_CRASH: "1"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.31.6-alpine}
    depends_on:
      - cerver
      - cerver-disconnect
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
    volumes:
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
