services:
  cerver:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    security_opt:
      - seccomp=unconfined
    command: ["../bin/web/features"]
    environment:
      CERVER_TEST_ADDRESS: "::"
      CERVER_TEST_HANDLER: ${CERVER_TEST_HANDLER:-threads}
      CERVER_TEST_BACKEND: ${CERVER_TEST_BACKEND:-}
      CERVER_TEST_KEEP_ALIVE: ${CERVER_TEST_KEEP_ALIVE:-}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  cerver-2:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    security_opt:
      - seccomp=unconfined
    command: ["../bin/web/features"]
    profiles: ["restart"]
    environment:
      CERVER_TEST_ADDRESS: "::"
      CERVER_TEST_HANDLER: ${CERVER_TEST_HANDLER:-threads}
      CERVER_TEST_BACKEND: ${CERVER_TEST_BACKEND:-}
      CERVER_TEST_KEEP_ALIVE: ${CERVER_TEST_KEEP_ALIVE:-}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  cerver-disconnect:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    security_opt:
      - seccomp=unconfined
    command: ["../bin/web/disconnect"]
    restart: always
    environment:
      CERVER_TEST_ADDRESS: "::"
      CERVER_TEST_HANDLER: ${CERVER_TEST_HANDLER:-threads}
      CERVER_TEST_BACKEND: ${CERVER_TEST_BACKEND:-}
      CERVER_TEST_KEEP_ALIVE: ${CERVER_TEST_KEEP_ALIVE:-}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  cerver-disconnect-2:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    security_opt:
      - seccomp=unconfined
    command: ["../bin/web/disconnect"]
    restart: always
    profiles: ["pair"]
    environment:
      CERVER_TEST_ADDRESS: "::"
      CERVER_TEST_HANDLER: ${CERVER_TEST_HANDLER:-threads}
      CERVER_TEST_BACKEND: ${CERVER_TEST_BACKEND:-}
      CERVER_TEST_KEEP_ALIVE: ${CERVER_TEST_KEEP_ALIVE:-}
      DISCONNECT_CRASH: "1"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  cerver-websocket:
    image: ${IMAGE:-ermiry/cerver:test}
    working_dir: /opt/cerver/test/web
    security_opt:
      - seccomp=unconfined
    command: ["../bin/web/websocket"]
    environment:
      CERVER_TEST_ADDRESS: "::"
      CERVER_TEST_HANDLER: ${CERVER_TEST_HANDLER:-threads}
      CERVER_TEST_BACKEND: ${CERVER_TEST_BACKEND:-}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.31.6-alpine}
    depends_on:
      cerver:
        condition: service_started
      cerver-2:
        condition: service_started
        required: false
      cerver-disconnect:
        condition: service_started
      cerver-websocket:
        condition: service_started
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
    volumes:
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
