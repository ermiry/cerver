<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Cerver WebSocket</title>
		<style>
			body { font-family: sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
			#log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 8px; white-space: pre-wrap; }
			form { display: flex; gap: 8px; margin-top: 8px; }
			input { flex: 1; padding: 6px; }
		</style>
	</head>
	<body>
		<h1>Cerver WebSocket chat</h1>
		<p>Write <code>/join room</code> to change of room, every other text goes to the others of your room.</p>
		<div id="log"></div>
		<form id="form">
			<input id="text" autocomplete="off" placeholder="message">
			<button type="submit">Send</button>
		</form>
		<script>
			const log = document.getElementById ("log");
			const write = (line) => { log.textContent += line + "\n"; log.scrollTop = log.scrollHeight; };

			const socket = new WebSocket (`ws://${location.host}/ws/chat`);
			socket.onopen = () => write ("connected to the lobby");
			socket.onmessage = (event) => write (event.data);
			socket.onclose = (event) => write (`closed with ${event.code}`);

			document.getElementById ("form").onsubmit = (event) => {
				event.preventDefault ();
				const input = document.getElementById ("text");
				if (input.value) {
					socket.send (input.value);
					write (`me: ${input.value}`);
					input.value = "";
				}
			};
		</script>
	</body>
</html>
