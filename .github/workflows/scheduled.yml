name: Cerver Scheduled

on:
  workflow_dispatch:

env:
  WERROR: 1

jobs:
  integration-thread:
    name: Cerver integration tests with thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable address randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Integration Tests
        env:
          SANITIZER: thread
        run: bash test/integration.sh

  repeat:
    name: Cerver flaky hunter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Threads pair
        run: bash test/repeat.sh cerver/threads 200

      - name: Client lifecycle
        env:
          BUILD: 0
        run: bash test/repeat.sh test/bin/client/lifecycle 200

      - name: Cerver core
        env:
          BUILD: 0
        run: bash test/repeat.sh test/bin/cerver/core 50

      - name: HTTP
        env:
          BUILD: 0
        run: bash test/repeat.sh test/bin/http 50

  fuzz:
    name: Cerver long fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fuzzing
        env:
          SECONDS_PER_TARGET: 1800
        run: bash test/fuzz.sh

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: ./fuzz-artifacts/
          retention-days: 14

  performance:
    name: Cerver performance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libcurl4-openssl-dev valgrind

      - name: Performance
        run: bash test/performance.sh

      - name: Core allocations
        run: bash test/allocations.sh

  stress:
    name: Cerver protocol stress with concurrent clients
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stress
        run: bash test/stress.sh

  nginx:
    name: Cerver behind nginx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: nginx
        run: bash test/nginx/run.sh

  disconnect:
    name: Cerver clients that disconnect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable address randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Disconnect matrix
        run: bash test/disconnect.sh
