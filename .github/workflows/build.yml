name: Cerver Continuous Integration

on:
  push:
    branches-ignore:
      - 'master'
      - '*beta'
  pull_request:
    branches-ignore:
      - 'master'
      - '*beta'

jobs:
  build:
    name: Cerver build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Information
        run: gcc --version && g++ --version

      - name: gcc make
        run: make
      - name: gcc examples
        run: make examples

      - name: clean examples
        run: make clean-examples

      - name: g++ examples
        run: make CC=g++ examples

      - name: Archive Shared Library
        uses: actions/upload-artifact@v4
        with:
          name: cerver-lib
          path: ./bin/libcerver.so
          retention-days: 1

  test:
    name: Cerver tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libcurl4-openssl-dev

      - name: gcc library
        run: make TYPE=test
      - name: gcc tests
        run: make TYPE=test test
      - name: gcc run tests
        run: bash test/run.sh

      - name: clean
        run: make clean

      - name: g++ library
        run: make TYPE=test CC=g++
      - name: g++ tests
        run: make TYPE=test CC=g++ test
      - name: g++ run tests
        run: bash test/run.sh

  sanitizers:
    name: Cerver tests with ${{ matrix.sanitizer }} sanitizer
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.sanitizer == 'thread' }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libcurl4-openssl-dev

      - name: Disable address randomization
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Library
        run: make TYPE=test SANITIZER=${{ matrix.sanitizer }}
      - name: Tests
        run: make TYPE=test SANITIZER=${{ matrix.sanitizer }} test

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: bash test/run.sh
