name: Cerver Tests

on:
  pull_request:
    branches:
      - '*'

jobs:
  test:
    name: Cerver tests
    runs-on: ubuntu-latest
    container:
      image: gcc:16.2
      options: --sysctl net.ipv6.conf.all.disable_ipv6=0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile Sources
        run: make TYPE=test COVERAGE=1

      - name: Compile Tests
        run: make TYPE=test COVERAGE=1 test

      - name: Unit Tests
        run: bash test/run.sh

      - name: Coverage
        run: make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          flags: unittests
          name: build
          fail_ci_if_error: true
          # verbose: true

  integration:
    name: Cerver integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Integration Tests
        env:
          COVERAGE: 1
        run: bash test/integration.sh

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage-integration/
          flags: integration
          name: integration
          fail_ci_if_error: true

  integration-sanitizers:
    name: Cerver integration tests with address and undefined sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Integration Tests
        env:
          SANITIZER: address,undefined
        run: bash test/integration.sh

  fuzz:
    name: Cerver fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fuzzing
        env:
          SECONDS_PER_TARGET: 30
        run: bash test/fuzz.sh

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: ./fuzz-artifacts/
          retention-days: 7
