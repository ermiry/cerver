name: Cerver Pre-Release

on:
  push:
    branches:
      - '*beta'

jobs:
  build:
    name: Create Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read version file
        id: get_version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Release names
        id: names
        run: |
          case "${{ github.ref_name }}" in
            http-beta)    echo "title=HTTP Beta"    >> "$GITHUB_OUTPUT"; echo "moving=beta"         >> "$GITHUB_OUTPUT" ;;
            nightly-beta) echo "title=Nightly Beta" >> "$GITHUB_OUTPUT"; echo "moving=nightly-beta" >> "$GITHUB_OUTPUT" ;;
            labs-beta)    echo "title=Labs Beta"    >> "$GITHUB_OUTPUT"; echo "moving=labs-beta"    >> "$GITHUB_OUTPUT" ;;
            beta)         echo "title=Beta"         >> "$GITHUB_OUTPUT"; echo "moving=core-beta"    >> "$GITHUB_OUTPUT" ;;
            *)            echo "title=Beta"         >> "$GITHUB_OUTPUT"; echo "moving="             >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Read changelog
        id: get_changes
        run: |
          {
            echo "changes<<CHANGELOG_END"
            cat CHANGELOG.md
            echo
            echo "CHANGELOG_END"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pre-Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.names.outputs.title }} ${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_changes.outputs.changes }}
          draft: false
          prerelease: true