name: Cerver Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  integration-thread:
    name: Cerver integration tests with thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable address randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Integration Tests
        env:
          SANITIZER: thread
        run: bash test/integration.sh

  repeat:
    name: Cerver flaky hunter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Threads pair
        run: bash test/repeat.sh cerver/threads 200

      - name: Balancer round robin pair
        env:
          BUILD: 0
        run: bash test/repeat.sh balancer/round_robin 50

      - name: Balancer handler id pair
        env:
          BUILD: 0
        run: bash test/repeat.sh balancer/handler_id 50

  fuzz:
    name: Cerver long fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fuzzing
        env:
          SECONDS_PER_TARGET: 300
        run: bash test/fuzz.sh

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: ./fuzz-artifacts/
          retention-days: 14
